[package]
name = "fakenmap"
version = "1.0.0"
edition = "2021"
description = "A Nmap-style network scanner engine (backend for the Fake Nmap GUI)"

[[bin]]
name = "fakenmap"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1